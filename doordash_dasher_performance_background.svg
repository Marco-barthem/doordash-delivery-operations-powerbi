<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <title>DoorDash — Dasher Performance</title>
  <desc>Editable 1440 × 900 Power BI background. One dasher selector, profile photo, five performance KPIs, SLA trend, delivery outcomes, detailed orders and failure reasons. Values and visuals are populated in Power BI.</desc>
  <defs>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; }
      .page-title { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #252525; }
      .page-note { font: 400 11px "Segoe UI", Arial, sans-serif; fill: #8A8A8A; }
      .kpi-title { font: 600 10.5px "Segoe UI", Arial, sans-serif; fill: #747474; letter-spacing: .25px; }
      .kpi-title-critical { font: 650 10.5px "Segoe UI", Arial, sans-serif; fill: #C82D18; letter-spacing: .25px; }
      .kpi-note { font: 400 9.5px "Segoe UI", Arial, sans-serif; fill: #9A9A9A; }
      .panel-title-primary { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #252525; }
      .panel-title { font: 600 12.5px "Segoe UI", Arial, sans-serif; fill: #333333; }
      .panel-note { font: 400 10.5px "Segoe UI", Arial, sans-serif; fill: #979797; }
      .nav { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #3D3D3D; }
      .toggle { font: 500 9px "Segoe UI", Arial, sans-serif; fill: #686868; }
    </style>
  </defs>

  <!-- CANVAS -->
  <rect width="1440" height="900" fill="#F7F7F7"/>

  <!-- SIDEBAR -->
  <g id="sidebar">
    <rect width="231" height="900" fill="#FFFFFF"/>
    <line x1="230.5" y1="0" x2="230.5" y2="900" stroke="#E1E1E1"/>

    <g id="brand" transform="translate(24 24)">
      <path d="M0 0H28C35.5 0 41 4.1 41 10C41 15.9 35.5 20 28 20H17.5L12.6 14.5H28C30.9 14.5 32.8 12.8 32.8 10C32.8 7.2 30.9 5.5 28 5.5H5.1L0 0Z" fill="#FF3008"/>
      <text x="52" y="16" class="font" font-size="17" font-weight="750" letter-spacing="1.1" fill="#E83B22">DOORDASH</text>
      <text x="0" y="39" class="font" font-size="10.5" fill="#808080">Delivery Operations Center</text>
    </g>

    <text x="30" y="112" class="font" font-size="12" font-weight="650" fill="#262626">United States Operations</text>
    <line x1="0" y1="139.5" x2="231" y2="139.5" stroke="#E7E7E7"/>

    <!-- Leave central sidebar area free for Power BI page-navigation buttons -->
    <g id="lower-navigation">
      <line x1="20" y1="464.5" x2="210" y2="464.5" stroke="#ECECEC"/>
      <g transform="translate(20 482)">
        <circle cx="13" cy="18" r="9" stroke="#2F2F2F" stroke-width="1.6"/>
        <path d="M13 13V18M13 22V22.2" stroke="#2F2F2F" stroke-width="1.6" stroke-linecap="round"/>
        <text x="34" y="22" class="nav">Data Quality</text>
      </g>
      <g transform="translate(20 530)">
        <circle cx="13" cy="18" r="3" stroke="#2F2F2F" stroke-width="1.5"/>
        <path d="M13 8V11M13 25V28M3 18H6M20 18H23M5.9 10.9L8 13M18 23L20.1 25.1M20.1 10.9L18 13M8 23L5.9 25.1" stroke="#2F2F2F" stroke-width="1.4" stroke-linecap="round"/>
        <text x="34" y="22" class="nav">Settings</text>
      </g>
    </g>

    <g id="sidebar-footer" transform="translate(20 824)">
      <rect width="191" height="52" rx="8" fill="#FAFAFA" stroke="#E4E4E4"/>
      <circle cx="25" cy="26" r="12" fill="#FFE1DA"/>
      <text x="25" y="30" class="font" text-anchor="middle" font-size="10" font-weight="700" fill="#D92F17">US</text>
      <text x="46" y="22" class="font" font-size="10.5" font-weight="650" fill="#333333">Control Tower</text>
      <text x="46" y="36" class="font" font-size="9" fill="#8A8A8A">Operational dashboard</text>
    </g>
  </g>


<g id="dasher-page">
<text x="263" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#252525">Dasher Performance</text>
<text x="263" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#8A8A8A">Individual delivery performance and order history</text>
<g id="single-dasher-filter">
<rect x="1088" y="18" width="320" height="48" rx="9" fill="#FFFFFF" stroke="#E8E8E8"/>
<text x="1104" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#8A8A8A">DASHER</text>
<line x1="1160" y1="29" x2="1160" y2="55" stroke="#ECECEC"/>
<!-- Place a single-select native Dasher slicer at x=1172, y=24, width=224, height=36. -->
</g>
<g id="dasher-profile">
<rect x="263" y="86" width="248" height="374" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="283" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#747474">DASHER PROFILE</text>
<circle cx="387" cy="177" r="47" fill="#FFF4F1" stroke="#FFD6CB"/>
<!-- Overlay the dynamic dasher photo inside x=340, y=130, width=94, height=94. -->
<g id="photo-placeholder" stroke="#E6AB9E" stroke-width="2" fill="none"><circle cx="387" cy="167" r="12"/><path d="M363 202C363 181 411 181 411 202" stroke-linecap="round"/></g>
<text x="387" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#333333"></text>
<!-- Dynamic name: x=283, y=233, width=208, height=30; city/state: x=283, y=267, width=208, height=22. -->
<line x1="283" y1="304" x2="491" y2="304" stroke="#ECECEC"/>
<text x="283" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#8A8A8A">DASHER ID</text>
<text x="397" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#8A8A8A">VEHICLE</text>
<!-- Dynamic ID and vehicle values: y=340, height=24. -->
<line x1="283" y1="379" x2="491" y2="379" stroke="#ECECEC"/>
<text x="283" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#8A8A8A">PERFORMANCE VS. FLEET</text>
<!-- Dynamic SLA difference versus the fleet: x=283, y=414, width=208, height=28. -->
</g>
<g id="kpi-total-deliveries">
<rect x="527" y="86" width="165" height="112" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="541" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="600" text-anchor="start" fill="#747474">TOTAL DELIVERIES</text>
<text x="541" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#9A9A9A">Orders in selected period</text>
<!-- KPI value: x=541, y=121, width=137, height=46. -->
</g>
<g id="kpi-sla">
<rect x="706" y="86" width="165" height="112" rx="9" fill="#FFF4F1" stroke="#FFB7A8"/>
<rect x="706" y="86" width="4" height="112" rx="2" fill="#FF3008"/>
<text x="720" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="600" text-anchor="start" fill="#C82D18">SLA %</text>
<text x="720" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#9A9A9A">On-time deliveries</text>
<!-- KPI value: x=720, y=121, width=137, height=46. -->
</g>
<g id="kpi-failed-rate">
<rect x="885" y="86" width="165" height="112" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="899" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="600" text-anchor="start" fill="#747474">FAILED RATE</text>
<text x="899" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#9A9A9A">Share of failed orders</text>
<!-- KPI value: x=899, y=121, width=137, height=46. -->
</g>
<g id="kpi-resolution">
<rect x="1064" y="86" width="165" height="112" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="1078" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="600" text-anchor="start" fill="#747474">AVG. RESOLUTION TIME</text>
<text x="1078" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#9A9A9A">Minutes per delivery</text>
<!-- KPI value: x=1078, y=121, width=137, height=46. -->
</g>
<g id="kpi-delay">
<rect x="1243" y="86" width="165" height="112" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="1257" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="600" text-anchor="start" fill="#747474">AVG. DELAY TIME</text>
<text x="1257" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#9A9A9A">Late deliveries only</text>
<!-- KPI value: x=1257, y=121, width=137, height=46. -->
</g>
<g id="sla-trend">
<rect x="527" y="212" width="539" height="248" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="545" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#252525">SLA Performance Trend</text>
<text x="545" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#979797">Track consistency across the selected period</text>
</g>
<rect x="527" y="212" width="72" height="3" rx="1.5" fill="#FF3008"/>
<g id="delivery-outcome">
<rect x="1080" y="212" width="328" height="248" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="1098" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#252525">Delivery Outcome</text>
<text x="1098" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#979797">On time, late and failed</text>
</g>
<g id="order-details">
<rect x="263" y="474" width="771" height="395" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="281" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#252525">Order Analytics</text>
<text x="281" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#979797">Delivery-level details · timing, outcome and SLA</text>
</g>
<rect x="263" y="474" width="72" height="3" rx="1.5" fill="#FF3008"/>
<line x1="281" y1="539" x2="1016" y2="539" stroke="#ECECEC"/>
<!-- Native table area: x=281, y=551, width=735, height=300. Suggested columns: Order ID, Closed At, City, Status, Resolution Time, Delay, SLA. -->
<g id="failure-reasons">
<rect x="1048" y="474" width="360" height="395" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="1066" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#252525">Top Failure Reasons</text>
<text x="1066" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#979797">Main causes of unsuccessful deliveries</text>
</g>
<!-- All displayed values, tables and charts are dynamic native Power BI visuals. No sample data or fixed performance thresholds. -->
</g></svg>