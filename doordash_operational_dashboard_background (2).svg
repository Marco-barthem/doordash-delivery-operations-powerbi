<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <title>DoorDash Operational Overview — Focused Layout</title>
  <desc>Editable Power BI SVG background with a compact filter area, emphasized SLA card, and clear visual hierarchy.</desc>
  <defs>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; }
      .page-title { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #252525; }
      .page-note { font: 400 11px "Segoe UI", Arial, sans-serif; fill: #8A8A8A; }
      .kpi-title { font: 600 10.5px "Segoe UI", Arial, sans-serif; fill: #747474; letter-spacing: .25px; }
      .kpi-title-critical { font: 650 10.5px "Segoe UI", Arial, sans-serif; fill: #C82D18; letter-spacing: .25px; }
      .kpi-note { font: 400 9.5px "Segoe UI", Arial, sans-serif; fill: #9A9A9A; }
      .panel-title-primary { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #252525; }
      .panel-title { font: 600 12.5px "Segoe UI", Arial, sans-serif; fill: #333333; }
      .panel-note { font: 400 10.5px "Segoe UI", Arial, sans-serif; fill: #979797; }
      .nav { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #3D3D3D; }
      .toggle { font: 500 9px "Segoe UI", Arial, sans-serif; fill: #686868; }
    </style>
  </defs>

  <!-- CANVAS -->
  <rect width="1440" height="900" fill="#F7F7F7"/>

  <!-- SIDEBAR -->
  <g id="sidebar">
    <rect width="231" height="900" fill="#FFFFFF"/>
    <line x1="230.5" y1="0" x2="230.5" y2="900" stroke="#E1E1E1"/>

    <g id="brand" transform="translate(24 24)">
      <path d="M0 0H28C35.5 0 41 4.1 41 10C41 15.9 35.5 20 28 20H17.5L12.6 14.5H28C30.9 14.5 32.8 12.8 32.8 10C32.8 7.2 30.9 5.5 28 5.5H5.1L0 0Z" fill="#FF3008"/>
      <text x="52" y="16" class="font" font-size="17" font-weight="750" letter-spacing="1.1" fill="#E83B22">DOORDASH</text>
      <text x="0" y="39" class="font" font-size="10.5" fill="#808080">Delivery Operations Center</text>
    </g>

    <text x="30" y="112" class="font" font-size="12" font-weight="650" fill="#262626">United States Operations</text>
    <line x1="0" y1="139.5" x2="231" y2="139.5" stroke="#E7E7E7"/>

    <!-- Leave central sidebar area free for Power BI page-navigation buttons -->
    <g id="lower-navigation">
      <line x1="20" y1="464.5" x2="210" y2="464.5" stroke="#ECECEC"/>
      <g transform="translate(20 482)">
        <circle cx="13" cy="18" r="9" stroke="#2F2F2F" stroke-width="1.6"/>
        <path d="M13 13V18M13 22V22.2" stroke="#2F2F2F" stroke-width="1.6" stroke-linecap="round"/>
        <text x="34" y="22" class="nav">Data Quality</text>
      </g>
      <g transform="translate(20 530)">
        <circle cx="13" cy="18" r="3" stroke="#2F2F2F" stroke-width="1.5"/>
        <path d="M13 8V11M13 25V28M3 18H6M20 18H23M5.9 10.9L8 13M18 23L20.1 25.1M20.1 10.9L18 13M8 23L5.9 25.1" stroke="#2F2F2F" stroke-width="1.4" stroke-linecap="round"/>
        <text x="34" y="22" class="nav">Settings</text>
      </g>
    </g>

    <g id="sidebar-footer" transform="translate(20 824)">
      <rect width="191" height="52" rx="8" fill="#FAFAFA" stroke="#E4E4E4"/>
      <circle cx="25" cy="26" r="12" fill="#FFE1DA"/>
      <text x="25" y="30" class="font" text-anchor="middle" font-size="10" font-weight="700" fill="#D92F17">US</text>
      <text x="46" y="22" class="font" font-size="10.5" font-weight="650" fill="#333333">Control Tower</text>
      <text x="46" y="36" class="font" font-size="9" fill="#8A8A8A">Operational dashboard</text>
    </g>
  </g>

  <!-- MAIN PAGE -->
  <g id="main-content" transform="translate(231 0)">
    <g id="header">
      <text x="32" y="31" class="page-title">Operational Overview</text>
      <text x="32" y="51" class="page-note">Delivery performance across the United States</text>

      <!-- Compact refresh indicator: place the dynamic measure beside it in Power BI -->
      <g id="last-refresh" transform="translate(996 29)">
        <circle cx="4" cy="4" r="4" fill="#31A86E"/>
        <text x="15" y="7" class="font" font-size="8.5" font-weight="500" fill="#8C8C8C">LAST DATA REFRESH</text>
      </g>
    </g>

    <!-- COMPACT FILTER STRIP -->
    <g id="filter-strip">
      <rect x="32" y="68" width="1145" height="48" rx="9" fill="#FFFFFF"/>
      <text x="48" y="97" class="font" font-size="9" font-weight="650" fill="#989898" letter-spacing=".6">FILTERS</text>
      <line x1="101" y1="79" x2="101" y2="105" stroke="#E9E9E9"/>
      <!-- Remaining area intentionally blank for City, State, Vehicle Type and Closed At slicers -->
    </g>

    <!-- KPI HIERARCHY -->
    <g id="kpi-row" transform="translate(32 128)">
      <g id="kpi-total-orders">
        <rect width="185" height="94" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="16" y="24" class="kpi-title">TOTAL ORDERS</text>
      </g>

      <g id="kpi-sla-primary" transform="translate(197 0)">
        <rect width="268" height="94" rx="9" fill="#FFF4F1" stroke="#FFB7A8"/>
        <rect width="4" height="94" rx="2" fill="#FF3008"/>
        <text x="18" y="24" class="kpi-title-critical">SLA %</text>
        <text x="18" y="80" class="kpi-note">Target ≥ 92% · show variance versus target</text>
      </g>

      <g id="kpi-failed-rate" transform="translate(477 0)">
        <rect width="220" height="94" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <circle cx="17" cy="20" r="3" fill="#D92F17"/>
        <text x="28" y="24" class="kpi-title">FAILED RATE</text>
      </g>

      <g id="kpi-resolution-time" transform="translate(709 0)">
        <rect width="220" height="94" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="16" y="24" class="kpi-title">AVG. RESOLUTION TIME</text>
      </g>

      <g id="kpi-delay-time" transform="translate(941 0)">
        <rect width="204" height="94" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="16" y="24" class="kpi-title">AVG. DELAY TIME</text>
      </g>
    </g>

    <!-- PRIMARY ANALYSIS ROW -->
    <g id="primary-analysis" transform="translate(32 236)">
      <g id="sla-trend-background">
        <rect width="650" height="310" rx="9" fill="#FFFFFF" stroke="#DADADA"/>
        <rect x="0" y="0" width="72" height="3" rx="1.5" fill="#FF3008"/>
        <text x="18" y="31" class="panel-title-primary">SLA Performance Trend</text>
        <text x="18" y="49" class="panel-note">Trend against the 92% target</text>

        <!-- Background for transparent Power BI bookmark buttons -->
        <g id="time-granularity" transform="translate(475 17)">
          <rect width="157" height="27" rx="13.5" fill="#F5F5F5" stroke="#E5E5E5"/>
          <line x1="52.5" y1="5" x2="52.5" y2="22" stroke="#DEDEDE"/>
          <line x1="104.5" y1="5" x2="104.5" y2="22" stroke="#DEDEDE"/>
          <text x="26" y="17" text-anchor="middle" class="toggle">Day</text>
          <text x="78.5" y="17" text-anchor="middle" class="toggle">Week</text>
          <text x="131" y="17" text-anchor="middle" class="toggle">Month</text>
        </g>
      </g>

      <g id="delivery-outcome-background" transform="translate(664 0)">
        <rect width="220" height="310" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="16" y="31" class="panel-title">Delivery Outcome</text>
        <text x="16" y="49" class="panel-note">Delivered, canceled and failed</text>
      </g>

      <g id="sla-state-background" transform="translate(898 0)">
        <rect width="247" height="310" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="16" y="31" class="panel-title">SLA by State</text>
        <text x="16" y="49" class="panel-note">Lowest performance first</text>
        <g transform="translate(181 20)">
          <circle cx="3" cy="3" r="3" fill="#D92F17"/>
          <text x="11" y="6" class="font" font-size="8.5" fill="#8A8A8A">Below target</text>
        </g>
      </g>
    </g>

    <!-- DIAGNOSTIC ROW -->
    <g id="diagnostic-analysis" transform="translate(32 560)">
      <g id="failure-reasons-background">
        <rect width="400" height="309" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="18" y="30" class="panel-title">Top Failure Reasons</text>
        <text x="18" y="48" class="panel-note">Show the six main causes and group the rest as Other</text>
      </g>

      <g id="dasher-performance-background" transform="translate(414 0)">
        <rect width="731" height="309" rx="9" fill="#FFFFFF" stroke="#E0E0E0"/>
        <text x="18" y="30" class="panel-title">Dashers Requiring Attention</text>
        <text x="18" y="48" class="panel-note">Prioritize low SLA, high failure rate and operational impact</text>
      </g>
    </g>
  </g>
</svg>
